<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#090a0c">
  <meta name="robots" content="noindex,follow">
  <title>404 — страница не найдена · PSEUDOEF</title>
  <meta name="description" content="Страница не найдена. Вернитесь на главную страницу портфолио PSEUDOEF.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержимому</a>

  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-arrow-up" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></symbol>
  </svg>

  <header class="site-header" data-header>
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="PSEUDOEF — на главную">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span class="brand-name">PSEUDOEF</span>
      </a>
      <a class="nav-cta" href="/">На главную</a>
    </div>
  </header>

  <main class="error-page" id="main" tabindex="-1">
    <div class="wrap">
      <div class="error-inner">
        <p class="kicker">Error / 404</p>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Страница не нашлась.</h2>
        <p class="error-copy">Возможно, ссылка устарела или адрес набран с ошибкой. Вернитесь к проектам или на главную — там всё на месте.</p>
        <div class="error-actions">
          <a class="button button--primary" href="/">На главную</a>
          <a class="button button--ghost" href="/#projects">К проектам</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-bottom">
        <p>© <span data-year>2026</span> PSEUDOEF</p>
        <p class="footer-made">сделано и захостено на собственном сервере</p>
        <a class="footer-top-link" href="/">На главную
          <svg class="icon icon--stroke" aria-hidden="true"><use href="#icon-arrow-up"></use></svg>
        </a>
      </div>
    </div>
  </footer>
</body>
</html>
